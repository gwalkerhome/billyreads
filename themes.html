<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BillyReads | Cloud Theme Library</title>
    <style>
        :root { 
            --mc-font: 'Arial Black', Gadget, sans-serif; 
            --accent: #4a90e2;
            --flash-green: #76FF03;
        }
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            background: url('assets/newthemeback.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }

        /* Top Left Back Button */
        #btn-back {
            position: absolute;
            top: 20px; left: 20px;
            width: 70px; height: 70px;
            background: url('assets/back1.png') no-repeat center;
            background-size: contain;
            border: none; cursor: pointer;
            z-index: 100;
        }

        /* Horizontal Scroll Track for Themes */
        .theme-scroll-container {
            position: absolute;
            top: 50%; left: 0;
            transform: translateY(-50%);
            width: 100vw;
            height: 350px;
            display: flex;
            align-items: center;
            overflow-x: auto;
            padding: 0 50px;
            box-sizing: border-box;
            gap: 30px;
            z-index: 10;
        }
        .theme-scroll-container::-webkit-scrollbar { display: none; }

        .theme-card {
            min-width: 220px;
            background: rgba(42, 42, 42, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 15px; padding: 15px;
            border: 4px solid transparent; 
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            flex-shrink: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .theme-card.active { border-color: var(--flash-green); transform: scale(1.05); }
        .theme-title { 
            color: var(--accent); 
            font-family: var(--mc-font); 
            font-size: 0.8rem; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            text-align: center;
        }
        .thumb { width: 100%; height: 130px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; }
        .card-controls { display: flex; flex-direction: column; gap: 8px; }
        .btn-use { background: var(--flash-green); color: black; font-family: var(--mc-font); font-size: 11px; padding: 10px; border:none; border-radius:8px; cursor:pointer;}
        .btn-del { background: #ff4d4d; color: white; font-size: 10px; opacity: 0.8; padding: 6px; border-radius: 6px; border:none; cursor:pointer;}

        /* Bottom Image Buttons Hub */
        .bottom-nav-hub {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4vw;
            width: 90vw;
            z-index: 100;
        }
        .img-btn {
            width: 180px; height: 180px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border: none; background-color: transparent;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .img-btn:active { transform: scale(0.95); }

        #btn-import { background-image: url('assets/importtheme.png'); }
        #btn-adjust { background-image: url('assets/adjust2.png'); }
        #btn-create { background-image: url('assets/create.png'); }

        #status-msg { 
            position: absolute; 
            top: 100px; width: 100%; 
            text-align: center;
            font-size: 14px; color: var(--flash-green); 
            font-family: var(--mc-font);
            display: none; 
            text-shadow: 2px 2px 4px black;
        }
    </style>
</head>
<body>

    <button id="btn-back" onclick="location.href='settings.html'"></button>

    <div id="status-msg">Connecting to bridge...</div>

    <div class="theme-scroll-container" id="themeGrid">
        </div>

    <div class="bottom-nav-hub">
        <button id="btn-import" class="img-btn" onclick="location.href='newtheme.html'"></button>
        <button id="btn-adjust" class="img-btn" onclick="location.href='winadjust.html'"></button>
        <button id="btn-create" class="img-btn" onclick="location.href='createbg.html'"></button>
    </div>

    <script type="module">
        import { 
            db, storage, ref, deleteObject, 
            collection, getDocs, deleteDoc, doc, query, orderBy, 
            saveGlobalTheme, getGlobalTheme 
        } from "./firebase-bridge.js";

        const DEFAULT_LAYOUT = {
            'pane-back': {t:5, l:5, w:10, h:10},
            'pane-birch': {t:5, l:30, w:40, h:10},
            'pane-stone': {t:25, l:25, w:50, h:30},
            'pane-record': {t:65, l:35, w:30, h:15},
            'pane-speech': {t:40, l:80, w:10, h:15},
            'pane-valenciano': {t:75, l:25, w:50, h:8},
            'pane-val-toggle': {t:75, l:15, w:8, h:8},
            'pane-slab': {t:88, l:20, w:60, h:10}
        };

        window.loadThemes = async () => {
            const grid = document.getElementById('themeGrid');
            const statusMsg = document.getElementById('status-msg');
            grid.innerHTML = '<p style="margin: auto;">Magic is loading...</p>';
            
            try {
                const cloudState = await getGlobalTheme();
                const activeId = cloudState ? cloudState.activeThemeId : null;

                const q = query(collection(db, "themes"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                grid.innerHTML = '';

                if (querySnapshot.empty) {
                    grid.innerHTML = '<p style="margin: auto; opacity:0.7;">The Library is empty.</p>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const theme = docSnap.data();
                    const id = docSnap.id;
                    const isActive = activeId === id;
                    const layoutData = theme.layout || DEFAULT_LAYOUT;

                    const card = document.createElement('div');
                    card.className = `theme-card ${isActive ? 'active' : ''}`;
                    card.innerHTML = `
                        <div class="theme-title">${id}</div>
                        <img src="${theme.url}" class="thumb">
                        <div class="card-controls">
                            <button id="use-${id}" class="btn-use">
                                ${isActive ? '✅ ACTIVE' : 'USE THEME'}
                            </button>
                            <button class="btn-del" onclick="deleteTheme('${id}', '${theme.storagePath || ''}')">DELETE</button>
                        </div>
                    `;
                    grid.appendChild(card);

                    document.getElementById(`use-${id}`).onclick = () => selectTheme(id, theme.url, layoutData);
                });
            } catch (err) {
                grid.innerHTML = '<p style="margin: auto;">Error connecting to the vault.</p>';
                console.error(err);
            }
        };

        window.selectTheme = async (id, url, layout) => {
            const status = document.getElementById('status-msg');
            status.style.display = 'block';
            status.innerText = "⏳ Updating Global Theme...";
            
            const success = await saveGlobalTheme(id, url, layout);
            if (success) {
                status.innerText = "✅ Theme Updated!";
                setTimeout(() => { status.style.display = 'none'; }, 2000);
                loadThemes();
            } else {
                alert("Failed to update theme.");
                status.style.display = 'none';
            }
        };

        window.deleteTheme = async (id, storagePath) => {
            if(!confirm(`Delete theme "${id}"?`)) return;
            try {
                await deleteDoc(doc(db, "themes", id));
                if (storagePath) {
                    await deleteObject(ref(storage, storagePath));
                }
                loadThemes();
            } catch (err) {
                console.error("Delete error:", err);
                loadThemes();
            }
        };

        loadThemes();
    </script>
</body>
</html>
