<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>v17 | billy reads editor</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --mc-font: 'Arial Black', Gadget, sans-serif;
            --accent-blue: #4a90e2;
            --danger-red: #e74c3c;
            --glass-bg: rgba(255, 255, 255, 0.15);
        }

        body, html {
            margin: 0; padding: 0; 
            width: 100vw; height: 100vh;
            background: #000; 
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        .stage-container {
            position: relative;
            width: 100vw;
            height: 56.25vw; 
            max-height: 100vh;
            max-width: 177.78vh; 
            background: #111;
            overflow: hidden;
            margin: auto;
        }

        #backdrop {
            position: absolute; inset: 0;
            background-size: cover;
            background-position: center;
            z-index: 1;
            filter: blur(5px) brightness(0.8);
        }

        .ui-btn {
            position: absolute;
            cursor: pointer;
            z-index: 500;
            border: none;
            background: transparent;
            padding: 0;
            transition: transform 0.1s;
        }
        .ui-btn img {
            display: block;
            width: 100%;
            height: auto;
            filter: drop-shadow(0px 8px 10px rgba(0,0,0,0.4));
        }
        .ui-btn:active { transform: scale(0.9); }

        #btn-top-back { top: 5%; left: 3%; width: 8%; }

        .main-card {
            position: absolute;
            top: 10%; left: 50%;
            transform: translateX(-50%);
            width: 45%;
            background: transparent; 
            text-align: center; z-index: 10;
        }

        h1 { 
            font-family: var(--mc-font); 
            color: white; 
            font-size: 1.8vw; 
            margin: 0 0 1.5vw 0; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        
        .upload-zone {
            border: 0.2vw dashed rgba(255,255,255,0.4); 
            border-radius: 1.5vw;
            padding: 3vw 1.5vw; margin: 1vw 0; cursor: pointer;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            color: white;
            transition: background 0.3s;
        }
        .upload-zone:hover { background: rgba(255,255,255,0.25); }

        #file-input { display: none; }

        #status { 
            font-size: 1.1vw; 
            color: #ffd700; 
            margin-top: 1vw; 
            min-height: 1.5em; 
            font-weight: 600; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .bottom-strip-container { 
            position: absolute;
            bottom: 12%; left: 5%; right: 5%;
            z-index: 10;
        }

        .strip-label { 
            font-family: var(--mc-font); 
            font-size: 0.8vw; 
            color: white; 
            margin-bottom: 0.5vw; 
            text-transform: uppercase; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5); 
        }

        .asset-strip {
            display: flex; gap: 1vw; overflow-x: auto; padding: 1.5vw;
            height: 10vw; align-items: center;
            background: var(--glass-bg); 
            border-radius: 1vw;
            backdrop-filter: blur(15px);
            border: 0.1vw solid rgba(255,255,255,0.1);
        }

        .strip-item {
            position: relative; min-width: 8vw; height: 8vw;
            background-size: cover; background-position: center;
            border-radius: 0.8vw; border: 0.2vw solid white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); flex-shrink: 0;
            cursor: grab;
        }
        .strip-item:active { cursor: grabbing; }
        
        .sortable-ghost { opacity: 0.3; transform: scale(0.9); }

        .btn-del {
            position: absolute; top: -0.5vw; right: -0.5vw;
            width: 1.8vw; height: 1.8vw; background: var(--danger-red);
            color: white; border: 0.15vw solid white; border-radius: 50%;
            font-size: 1vw; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            z-index: 20;
        }

        #btn-save { 
            position: absolute;
            bottom: 3%; right: 5%;
            width: 10%; 
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="stage-container">
        <div id="backdrop"></div>

        <button id="btn-top-back" class="ui-btn" onclick="location.href='pages.html'">
            <img src="assets/back1.png" alt="back">
        </button>

        <div class="main-card">
            <h1 id="book-title-display">cargando...</h1>
            <div class="upload-zone" onclick="document.getElementById('file-input').click()">
                <strong style="color: #76FF03; font-size: 1.4vw;">+ añadir página</strong>
                <p style="font-size: 1vw; color: #eee; margin-top: 0.5vw;">toca para subir foto del libro.</p>
            </div>
            <input type="file" id="file-input" accept="image/*">
            <div id="status">esperando página...</div>
        </div>

        <div class="bottom-strip-container">
            <div class="strip-label">páginas: (arrastra para reordenar)</div>
            <div class="asset-strip" id="asset-strip"></div>
        </div>

        <button id="btn-save" class="ui-btn" onclick="location.href='pages.html'">
            <img src="assets/save.png" alt="save">
        </button>
    </div>

    <script type="module">
        import { db, storage, collection, doc, setDoc, getDocs, deleteDoc, query, orderBy, ref, uploadBytes, getDownloadURL, writeBatch } from "./firebase-bridge.js";

        const bookid = localStorage.getItem('current_book_id');
        const booktitle = localStorage.getItem('current_book_title');
        const backdropurl = localStorage.getItem('current_book_backdrop');
        const geminikey = localStorage.getItem('gemini_key');

        if (!bookid) location.href = 'magicbook.html';
        document.getElementById('book-title-display').innerText = booktitle ? booktitle.toLowerCase() : "libro";

        if (backdropurl) {
            document.getElementById('backdrop').style.backgroundImage = `url('${backdropurl}')`;
        }

        const fileinput = document.getElementById('file-input');
        const status = document.getElementById('status');
        const strip = document.getElementById('asset-strip');

        const sortable = Sortable.create(strip, {
            animation: 150,
            ghostClass: 'sortable-ghost',
            onEnd: async () => {
                await updatepageorder();
            }
        });

        async function updatepageorder() {
            status.style.color = "#ffd700";
            status.innerText = "🔄 actualizando orden...";
            
            const batch = writeBatch(db);
            const items = strip.querySelectorAll('.strip-item');
            
            items.forEach((item, index) => {
                const pageid = item.getAttribute('data-id');
                const pageref = doc(db, `books/${bookid}/pages`, pageid);
                batch.update(pageref, { pagenumber: index + 1 });
            });

            try {
                await batch.commit();
                status.style.color = "#76FF03";
                status.innerText = "✅ orden guardado.";
            } catch (err) {
                console.error(err);
                status.style.color = "#ff4757";
                status.innerText = "❌ error al ordenar.";
            }
        }

        async function internalCallGemini(file, prompt) {
            if (!geminikey) throw new Error("API Key missing. Please check settings.");
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminikey}`;
            
            const base64 = await new Promise((res) => {
                const r = new FileReader();
                r.onload = () => res(r.result.split(',')[1]);
                r.readAsDataURL(file);
            });

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: prompt }, { inline_data: { mime_type: file.type, data: base64 } }]
                    }]
                })
            });

            const data = await response.json();
            if (data.candidates && data.candidates[0].content) {
                return data.candidates[0].content.parts[0].text;
            }
            throw new Error(data.error ? data.error.message : "No text returned from AI");
        }

        async function processpagewithai(file) {
            status.style.color = "#ffd700";
            status.innerText = "🤖 la ia está leyendo y traduciendo...";
            const prompt = `Here is a picture of the inside of a children's reading book. 
            Perform OCR on this image. 
            1. Detect if the text is in Spanish, Valenciano, or English.
            2. Regardless of the original language, provide a translation for all three:
               - "es": The text in Spanish.
               - "va": The text in Valenciano.
               - "en": The text in English.
            Return ONLY a valid JSON object with these three keys. Use lowercase for all keys.`;

            try {
                const response = await internalCallGemini(file, prompt);
                const jsonstring = response.replace(/```json|```/gi, '').trim();
                return JSON.parse(jsonstring);
            } catch (e) {
                console.error("ai error:", e);
                throw e;
            }
        }

        async function refreshstrip() {
            const q = query(collection(db, `books/${bookid}/pages`), orderBy("pagenumber", "asc"));
            const snap = await getDocs(q);
            strip.innerHTML = "";
            snap.forEach(docsnap => {
                const data = docsnap.data();
                const item = document.createElement('div');
                item.className = 'strip-item';
                item.setAttribute('data-id', docsnap.id); 
                item.style.backgroundImage = `url('${data.imageurl}')`;
                item.innerHTML = `<button class="btn-del" onclick="window.deletepage('${docsnap.id}')">✕</button>`;
                strip.appendChild(item);
            });
            return snap.size;
        }

        window.deletepage = async (pageid) => {
            if (!confirm("¿borrar?")) return;
            await deleteDoc(doc(db, `books/${bookid}/pages`, pageid));
            refreshstrip();
        };

        fileinput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            status.style.color = "#ffd700";
            status.innerText = "📤 procesando imagen...";

            try {
                const currentcount = await refreshstrip();
                const aidata = await processpagewithai(file);
                const pageid = `page_${Date.now()}`;
                const storageref = ref(storage, `books/${bookid}/pages/${pageid}`);
                const snap = await uploadBytes(storageref, file);
                const url = await getDownloadURL(snap.ref);

                await setDoc(doc(collection(db, `books/${bookid}/pages`)), {
                    imageurl: url,
                    pagenumber: currentcount + 1,
                    text_es: aidata.es,
                    text_va: aidata.va,
                    text_en: aidata.en,
                    uploadedat: Date.now()
                });

                status.style.color = "#76FF03";
                status.innerText = "✅ guardado correctamente.";
                refreshstrip();
            } catch (err) {
                status.style.color = "#ff4757";
                status.innerText = "❌ error: " + err.message;
            }
        };

        refreshstrip();
    </script>
</body>
</html>
