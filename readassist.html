<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>billy reads | modo lectura</title>
    <style>
        :root {
            --mc-font: 'Arial Black', Gadget, sans-serif;
            --window-bg: rgba(255, 255, 255, 0.15);
            --accent-gold: #ffd700;
            --read-green: #76FF03;
            --quiz-bg: rgba(0, 0, 0, 0.6);

            /* --- LAYOUT CONTROL PANEL (PERCENTS) --- */
            --nav-btn-w: 8%;
            --lang-btn-w: 6%;
            --stage-margin-x: 4%; 
            --stage-margin-y: 6%;

            /* --- MAIN BUTTON CONTROLS (Vertical Stack) --- */
            /* Listen Button */
            --btn-voice-w: 25%;
            --btn-voice-top: 25%;
            --btn-voice-left: 25%;

            /* Read Button */
            --btn-mic-w: 30%;
            --btn-mic-top: 55%;
            --btn-mic-left: 25%;

            /* Quiz Button */
            --btn-quiz-w: 27%;
            --btn-quiz-top: 80%;
            --btn-quiz-left: 25%;
        }

        body, html {
            margin: 0; padding: 0; 
            width: 100vw; height: 100vh;
            background: #000; 
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            font-family: var(--mc-font);
        }

        /* 16:9 STAGE LOCK */
        .stage-container {
            position: relative;
            width: 100vw;
            height: 56.25vw; 
            max-height: 100vh;
            max-width: 177.78vh; 
            background: #111;
            overflow: hidden;
            margin: auto;
        }

        #backdrop {
            position: absolute; inset: 0;
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* Standardized UI Button Logic */
        .ui-btn {
            position: absolute;
            cursor: pointer;
            z-index: 500;
            border: none;
            background: transparent;
            padding: 0;
            transition: transform 0.1s, filter 0.2s;
        }
        .ui-btn img {
            display: block;
            width: 100%;
            height: auto;
            filter: drop-shadow(0px 8px 10px rgba(0,0,0,0.6));
        }
        .ui-btn:active { transform: scale(0.9); }
        .ui-btn.inactive { filter: grayscale(1) opacity(0.5); }

        /* Exit Button - Top Left */
        #btn-back { 
            top: var(--stage-margin-y); 
            left: var(--stage-margin-x); 
            width: var(--nav-btn-w); 
        }

        /* Language Toggles - Top Right */
        .language-bar {
            position: absolute;
            top: var(--stage-margin-y);
            right: var(--stage-margin-x);
            display: flex; 
            gap: 2%;
            z-index: 500;
            width: 25%;
            justify-content: flex-end;
        }
        .lang-asset-btn {
            width: var(--lang-btn-w);
            position: relative; 
        }

        /* Individual Main Action Placement */
        #btn-voice {
            width: var(--btn-voice-w);
            top: var(--btn-voice-top);
            left: var(--btn-voice-left);
            transform: translate(-50%, -50%);
        }
        #btn-mic {
            width: var(--btn-mic-w);
            top: var(--btn-mic-top);
            left: var(--btn-mic-left);
            transform: translate(-50%, -50%);
        }
        #btn-quiz {
            width: var(--btn-quiz-w);
            top: var(--btn-quiz-top);
            left: var(--btn-quiz-left);
            transform: translate(-50%, -50%);
        }

        /* Navigation Arrows */
        .nav-arrow {
            position: absolute;
            top: 35%;
            width: 6%; 
            aspect-ratio: 1/1;
            background: rgba(0,0,0,0.4);
            color: white; border: 0.2vw solid white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5vw; cursor: pointer; z-index: 200;
        }
        #prev-btn { left: 47%; }
        #next-btn { right: 2%; }

        /* Windows */
        .page-window {
            position: absolute;
            top: 12%; right: 5%;
            width: 44%; height: 48%;
            background: var(--window-bg);
            backdrop-filter: blur(12px);
            border-radius: 2vw;
            padding: 2%;
            box-sizing: border-box;
            z-index: 100;
            color: white; overflow-y: auto;
            border: 0.1vw solid rgba(255,255,255,0.2);
        }

        .quiz-window {
            position: absolute;
            top: 62%; right: 5%;
            width: 44%; height: 12%;
            background: var(--quiz-bg);
            backdrop-filter: blur(15px);
            border: 0.2vw solid var(--accent-gold);
            border-radius: 1.5vw;
            padding: 1%;
            z-index: 110;
            display: none;
            color: white;
            text-align: center;
        }

        /* Feedback States */
        .listening { animation: pulse 1.5s infinite; filter: brightness(1.2) drop-shadow(0 0 15px #ff4757); }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

        .page-text { font-size: 1.6vw; line-height: 1.6; font-family: 'Segoe UI', sans-serif; }
        .word-span { transition: color 0.2s; display: inline-block; white-space: pre; }
        .word-read { color: var(--read-green); text-shadow: 0 0 0.8vw rgba(118, 255, 3, 0.9); }
    </style>
</head>
<body>

    <div id="success-overlay" style="position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:2000; pointer-events:none; font-size:15rem;">✅</div>

    <div class="stage-container">
        <div id="backdrop"></div>

        <button id="btn-back" class="ui-btn" onclick="location.href='pages.html'">
            <img src="assets/back1.png" alt="back">
        </button>

        <div class="language-bar">
            <button id="btn-es" class="ui-btn lang-asset-btn" onclick="setlanguage('es')">
                <img src="assets/spanish.png" alt="es">
            </button>
            <button id="btn-va" class="ui-btn lang-asset-btn inactive" onclick="setlanguage('va')">
                <img src="assets/valencian.png" alt="va">
            </button>
            <button id="btn-en" class="ui-btn lang-asset-btn inactive" onclick="setlanguage('en')">
                <img src="assets/english.png" alt="en">
            </button>
        </div>

        <div id="prev-btn" class="nav-arrow" onclick="changepage(-1)">&lt;</div>
        <div id="next-btn" class="nav-arrow" onclick="changepage(1)">&gt;</div>

        <div class="page-window">
            <div id="text-content" class="page-text">
                <p id="loading-txt">abriendo libro...</p>
            </div>
        </div>

        <div id="quiz-window" class="quiz-window">
            <div id="quiz-text">preparando pregunta...</div>
        </div>

        <button id="btn-voice" class="ui-btn" onclick="togglevoice()">
            <img src="assets/listen2.png" alt="listen">
        </button>
        <button id="btn-mic" class="ui-btn" onclick="togglemic()">
            <img src="assets/readmic.png" alt="read">
        </button>
        <button id="btn-quiz" class="ui-btn" onclick="startquiz()">
            <img src="assets/quiz.png" alt="quiz">
        </button>
    </div>

    <script type="module">
        import { db, collection, getDocs, query } from "./firebase-bridge.js";

        const bookid = localStorage.getItem('current_book_id');
        const backdropurl = localStorage.getItem('current_book_backdrop');
        const selectedimageurls = JSON.parse(localStorage.getItem('selected_pages_json') || "[]");
        const geminikey = localStorage.getItem('gemini_key');
        
        let pagedata = []; 
        let currentindex = 0;
        let currentlang = 'es';
        let lastmatchedindex = -1;
        let isquizactive = false;

        const recognition = 'webkitSpeechRecognition' in window ? new webkitSpeechRecognition() : null;
        if (recognition) {
            recognition.continuous = true;
            recognition.interimResults = true;
        }

        if (backdropurl) {
            document.getElementById('backdrop').style.backgroundImage = `url('${backdropurl}')`;
        }

        async function initbook() {
            try {
                const q = query(collection(db, `books/${bookid}/pages`));
                const snap = await getDocs(q);
                const allpages = [];
                snap.forEach(doc => allpages.push(doc.data()));
                pagedata = selectedimageurls.map(url => allpages.find(p => p.imageurl === url)).filter(p => p !== undefined);
                updatedisplay();
            } catch (e) { console.error(e); }
        }

        window.setlanguage = (lang) => {
            stopvoice(); stopmic();
            currentlang = lang;
            document.querySelectorAll('.lang-asset-btn').forEach(btn => {
                btn.classList.toggle('inactive', btn.id !== `btn-${lang}`);
            });
            document.getElementById('quiz-window').style.display = 'none';
            isquizactive = false;
            updatedisplay();
        };

        window.changepage = (direction) => {
            const newindex = currentindex + direction;
            if (newindex >= 0 && newindex < pagedata.length) {
                stopvoice(); stopmic();
                currentindex = newindex;
                document.getElementById('quiz-window').style.display = 'none';
                isquizactive = false;
                updatedisplay();
            }
        };

        function updatedisplay() {
            const textcontent = document.getElementById('text-content');
            if (pagedata.length === 0) return;
            const currentpage = pagedata[currentindex];
            const fulltext = currentpage[`text_${currentlang}`] || "texto no disponible";
            lastmatchedindex = -1;
            textcontent.innerHTML = fulltext.split(/\s+/).map((word, i) => `<span id="word-${i}" class="word-span">${word}</span>`).join(' ');
        }

        window.togglevoice = () => {
            if (window.speechSynthesis.speaking) { stopvoice(); return; }
            stopmic();
            const rawtext = pagedata[currentindex][`text_${currentlang}`];
            const msg = new SpeechSynthesisUtterance(rawtext);
            msg.lang = currentlang === 'en' ? 'en-US' : 'es-ES';
            const voicename = currentlang === 'en' ? localStorage.getItem('billy_voice_en') : localStorage.getItem('billy_voice');
            const voices = window.speechSynthesis.getVoices();
            if (voicename) msg.voice = voices.find(v => v.name === voicename);
            msg.rate = parseFloat(localStorage.getItem('billy_rate') || 1.0);
            msg.onend = () => document.getElementById('btn-voice').classList.remove('listening');
            
            document.getElementById('btn-voice').classList.add('listening');
            window.speechSynthesis.speak(msg);
        };

        function stopvoice() {
            window.speechSynthesis.cancel();
            document.getElementById('btn-voice').classList.remove('listening');
        }

        window.startquiz = async () => {
            if (!geminikey) { alert("api key missing"); return; }
            stopmic(); stopvoice();
            const qwin = document.getElementById('quiz-window');
            qwin.style.display = 'block';
            document.getElementById('quiz-text').innerText = "...";
            isquizactive = true;

            try {
                const pagetext = pagedata[currentindex][`text_${currentlang}`];
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminikey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Based on: "${pagetext}", ask a very short child-friendly question in ${currentlang}. Text only.` }] }]
                    })
                });
                const data = await response.json();
                document.getElementById('quiz-text').innerText = data.candidates[0].content.parts[0].text;
                setTimeout(() => togglemic(), 1000);
            } catch (e) { document.getElementById('quiz-text').innerText = "error"; }
        };

        window.togglemic = () => {
            const btn = document.getElementById('btn-mic');
            if (btn.classList.contains('listening')) { stopmic(); } 
            else {
                stopvoice();
                btn.classList.add('listening');
                recognition.lang = currentlang === 'en' ? 'en-US' : 'es-ES';
                recognition.start();
            }
        };

        function stopmic() {
            if (recognition) recognition.stop();
            document.getElementById('btn-mic').classList.remove('listening');
        }

        async function verifyanswer(answer) {
            const pagetext = pagedata[currentindex][`text_${currentlang}`];
            const question = document.getElementById('quiz-text').innerText;
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminikey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Text: "${pagetext}". Question: "${question}". Answer: "${answer}". Correct? YES/NO only.` }] }]
                    })
                });
                const data = await response.json();
                if (data.candidates[0].content.parts[0].text.trim().toUpperCase().includes("YES")) {
                    const overlay = document.getElementById('success-overlay');
                    overlay.style.display = 'flex';
                    setTimeout(() => { overlay.style.display = 'none'; }, 2000);
                    stopmic();
                }
            } catch (e) { console.error(e); }
        }

        if (recognition) {
            recognition.onresult = (event) => {
                let transcript = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) transcript += event.results[i][0].transcript;
                if (isquizactive) {
                    if (event.results[event.results.length - 1].isFinal) verifyanswer(transcript);
                } else {
                    const spokenwords = transcript.toLowerCase().split(/\s+/);
                    const spans = document.querySelectorAll('.word-span');
                    spokenwords.forEach(spoken => {
                        const cleanvoice = spoken.replace(/[.,!?;:]/g, "");
                        for (let i = lastmatchedindex + 1; i <= Math.min(lastmatchedindex + 3, spans.length - 1); i++) {
                            if (cleanvoice === spans[i].innerText.toLowerCase().replace(/[.,!?;:]/g, "")) {
                                spans[i].classList.add('word-read');
                                lastmatchedindex = i;
                                break;
                            }
                        }
                    });
                }
            };
            recognition.onend = () => { if (document.getElementById('btn-mic').classList.contains('listening')) recognition.start(); };
        }

        initbook();
    </script>
</body>
</html>
