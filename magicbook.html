<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>billy reads | mi biblioteca 3d</title>
    <style>
        :root {
            --mc-font: 'Arial Black', Gadget, sans-serif;
            --accent-gold: #ffd700;

            /* --- LAYOUT CONTROL PANEL --- */
            
            /* 1. NAVIGATION BUTTONS (Back/Settings) */
            --btn-size: 8vw;
            --btn-margin: 2%;

            /* 2. NEW "ADD BOOK" ASSET BUTTON (Center Bottom) */
            --btn-add-width: 15vw;       /* Responsive Width of the new asset */
            --btn-add-bottom-margin: 1%;  /* Distance from the bottom edge */

            /* 3. BOOK TRACK AND SIZING */
            --book-width: 18vw;
            --book-height: 27vw; 
            --book-gap: 6vw;
            
            /* --------------------------- */
        }

        body, html {
            margin: 0; padding: 0; 
            width: 100vw; height: 100vh;
            background: #000; 
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            font-family: var(--mc-font);
        }

        /* 16:9 STAGE LOCK */
        .stage-container {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 Ratio */
            max-height: 100vh;
            max-width: 177.78vh; /* Prevents overflow on ultra-wide */
            background: url('assets/libraryback.jpeg') no-repeat center center;
            background-size: cover;
            perspective: 2000px;
            overflow: hidden;
        }

        /* Standard Asset-based Buttons (Back/Settings) */
        .ui-btn {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            width: var(--btn-size);
            height: var(--btn-size);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 0.1s;
        }
        .ui-btn:active { transform: scale(0.9); }

        #btn-back { top: var(--btn-margin); left: var(--btn-margin); background-image: url('assets/back1.png'); }
        #btn-settings { bottom: var(--btn-margin); right: var(--btn-margin); background-image: url('assets/settings.png'); }
        
        /* NEW CUSTOM ASSET BUTTON (Add Book) */
        .ui-btn-custom {
            position: absolute;
            cursor: pointer;
            z-index: 105; /* Slightly higher than other buttons */
            
            /* Load the new children's magical pixie book asset */
            background-image: url('assets/addbook1.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 0.1s;

            /* Positioning & Sizing from the Control Panel */
            width: var(--btn-add-width);
            
            /* Maintain the book's 3D perspective ratio (roughly 3:4 or 4:5 based on sample) */
            aspect-ratio: 4/5; 

            /* true center horizontally */
            left: 50%;
            transform: translateX(-50%);
            
            /* custom margin from bottom */
            bottom: var(--btn-add-bottom-margin);
        }
        .ui-btn-custom:active { transform: translateX(-50%) scale(0.9); }


        /* SCROLLABLE TRACK */
        .book-track {
            position: absolute;
            top: 0; left: 0;
            width: 100vw;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 10vw; /* Padding so first/last books don't hit edges */
            gap: var(--book-gap);
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            z-index: 10;
        }
        /* Hide Scrollbar */
        .book-track::-webkit-scrollbar { display: none; }

        .book-container {
            position: relative;
            flex: 0 0 auto; /* Prevents books from shrinking */
            width: var(--book-width);
            height: var(--book-height);
            scroll-snap-align: center;
            transform-style: preserve-3d;
            display: flex; align-items: center; justify-content: center;
        }

        .book-assembly {
            position: relative;
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            animation: float 5s ease-in-out infinite;
            animation-delay: var(--float-delay);
            cursor: pointer;
        }

        @keyframes float {
            0%, 100% { transform: rotateY(-10deg) translateY(0); }
            50% { transform: rotateY(10deg) translateY(-3vh); }
        }

        .book-template {
            position: absolute;
            inset: 0;
            background: url('assets/flbktmp.png') no-repeat center center;
            background-size: contain;
            z-index: 1;
        }

        .book-cover-art {
            position: absolute;
            top: 5%; left: 4%;
            width: 90%; height: 90%;
            background-size: cover;
            background-position: center;
            z-index: 10;
            border-radius: 2px;
            background-color: #333;
        }

        .book-shadow {
            position: absolute;
            bottom: -5vh; left: 50%;
            width: 80%; height: 2vh;
            background: rgba(0,0,0,0.4);
            border-radius: 50%;
            filter: blur(15px);
            transform: translateX(-50%);
            z-index: 0;
        }

        #loading-overlay {
            position: fixed; inset: 0; background: black; z-index: 2000;
            display: flex; align-items: center; justify-content: center; color: white;
        }
    </style>
</head>
<body>

    <div id="loading-overlay">leyendo pergaminos...</div>

    <div class="stage-container">
        <a href="index.html" id="btn-back" class="ui-btn"></a>
        <a href="settings.html" id="btn-settings" class="ui-btn"></a>
        
        <a href="newbook.html" id="btn-add-new" class="ui-btn-custom"></a>

        <div class="book-track" id="book-track"></div>
    </div>

    <script type="module">
        import { db, collection, getDocs, query, orderBy } from "./firebase-bridge.js";

        async function init3dLibrary() {
            const track = document.getElementById('book-track');
            const loader = document.getElementById('loading-overlay');

            try {
                const q = query(collection(db, "books"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                
                track.innerHTML = "";

                if (snap.empty) {
                    track.innerHTML = "<div style='color:white; width: 70vw; text-align:center;'>La biblioteca está vacía.</div>";
                    loader.style.display = 'none';
                    return;
                }

                snap.forEach((docSnap) => {
                    const book = docSnap.data();
                    const bookid = docSnap.id;
                    const coverUrl = book.coverURL || book.imageurl;

                    const container = document.createElement('div');
                    container.className = 'book-container';
                    
                    const delay = (Math.random() * -5).toFixed(2) + "s";
                    
                    container.innerHTML = `
                        <div class="book-shadow"></div>
                        <div class="book-assembly" style="--float-delay: ${delay}" onclick="selectBook('${bookid}', '${book.title}', '${book.backdropURL}')">
                            <div class="book-template"></div>
                            <div class="book-cover-art" style="background-image: url('${coverUrl}')"></div>
                        </div>
                    `;

                    track.appendChild(container);
                });

                loader.style.display = 'none';

            } catch (error) {
                console.error("Library load error:", error);
                loader.innerText = "Error de conexión.";
            }
        }

        window.selectBook = (id, title, backdrop) => {
            localStorage.setItem('current_book_id', id);
            localStorage.setItem('current_book_title', title);
            localStorage.setItem('current_book_backdrop', backdrop);
            location.href = 'pages.html';
        };

        window.onload = init3dLibrary;
    </script>
</body>
</html>
