<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Billy Reads | Selección de Páginas</title>
    <style>
        :root {
            --mc-font: 'Arial Black', Gadget, sans-serif;
            --gold-glow: 0 0 20px #ffd700, 0 0 40px rgba(255, 215, 0, 0.5);

            /* --- LAYOUT CONTROL PANEL --- */
            
            /* 1. ASSET WINDOW POSITION & SIZE */
            --window-right: 1%;      
            --window-top: 10%;       
            --window-width: 40%;     
            --window-height: 75%;    

            /* 2. PAGE THUMBNAIL SIZE */
            --page-width: 100px;     
            
            /* 3. GRID SPACING */
            --grid-cols: 4;          
            --column-gap: 6px;       
            --row-gap: 24px;         

            /* 4. ASSET BUTTONS POSITIONING */
            /* Add Page Button (roughly 75% across) */
            --btn-add-left: 75%;     
            --btn-add-top: 88%;      
            --btn-add-width: 180px;

            /* Let's Read Button (Middle of left side) */
            --btn-go-left: 25%;      
            --btn-go-top: 50%;       
            --btn-go-width: 220px;
            
            /* --------------------------- */
        }

        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; background: #000;
            font-family: var(--mc-font);
        }

        #main-backdrop {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        .asset-window {
            position: absolute;
            right: var(--window-right);
            top: var(--window-top);
            width: var(--window-width);
            height: var(--window-height);
            padding: 10px;
            overflow-y: auto;
            z-index: 10;
            display: grid;
            grid-template-columns: repeat(var(--grid-cols), 1fr);
            align-content: start; 
            column-gap: var(--column-gap);
            row-gap: var(--row-gap);
            box-sizing: border-box;
            background: transparent;
        }
        .asset-window::-webkit-scrollbar { width: 0px; }

        .page-thumb {
            position: relative;
            width: var(--page-width);
            aspect-ratio: 3/4;
            background: url('assets/paper1.png') no-repeat center center;
            background-size: contain;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            box-sizing: border-box;
            text-align: center;
            animation: magicWiggle 4s ease-in-out infinite;
            justify-self: center; 
        }

        .page-thumb:nth-child(even) { animation-duration: 5s; animation-delay: 0.5s; }
        .page-thumb:nth-child(3n) { animation-duration: 4.5s; animation-delay: 0.2s; }

        @keyframes magicWiggle {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-6px) rotate(1.5deg); }
            50% { transform: translateY(0) rotate(-1deg); }
            75% { transform: translateY(-4px) rotate(1deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        .page-thumb.selected {
            filter: drop-shadow(var(--gold-glow));
            transform: scale(1.1) !important;
            animation-play-state: paused;
            z-index: 20;
        }

        .page-num-label {
            font-size: 1rem;
            color: #4a3728;
            margin-top: 15px;
            pointer-events: none;
        }

        .page-text-preview {
            font-family: serif;
            font-size: 5px;
            line-height: 1.1;
            color: #5d4a3a;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 7;
            -webkit-box-orient: vertical;
            opacity: 0.7;
            font-style: italic;
            pointer-events: none;
        }

        .ui-btn {
            position: absolute; cursor: pointer; z-index: 100; border: none;
            background-color: transparent; background-size: contain;
            background-repeat: no-repeat; background-position: center;
            transition: transform 0.1s;
        }
        .ui-btn:active { transform: scale(0.9); }

        /* Standard Navigation */
        #btn-back { top: 5%; left: 3%; width: 70px; height: 70px; background-image: url('assets/back1.png'); }
        #btn-settings { bottom: 3%; right: 3%; width: 60px; height: 60px; background-image: url('assets/settings.png'); }

        /* Custom Asset Buttons */
        #btn-add { 
            left: var(--btn-add-left); 
            top: var(--btn-add-top); 
            width: var(--btn-add-width); 
            aspect-ratio: 4/1;
            transform: translateX(-50%); /* Centers on the 75% mark */
            background-image: url('assets/addpages.png'); 
        }

        #btn-go { 
            left: var(--btn-go-left); 
            top: var(--btn-go-top); 
            width: var(--btn-go-width);
            aspect-ratio: 2/1;
            transform: translate(-50%, -50%); /* True middle center */
            background-image: url('assets/leamos.png'); 
        }

        #loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; color: white; z-index: 1000; font-family: var(--mc-font); }
    </style>
</head>
<body>

    <div id="loading-overlay">PREPARANDO PÁGINAS...</div>
    <div id="main-backdrop"></div>

    <button id="btn-back" class="ui-btn" onclick="location.href='magicbook.html'"></button>
    <button id="btn-go" class="ui-btn" onclick="goToActivity()"></button>

    <div class="asset-window" id="pageList"></div>

    <button id="btn-add" class="ui-btn" onclick="location.href='addpages.html'"></button>
    <button id="btn-settings" class="ui-btn" onclick="location.href='settings.html'"></button>

    <script type="module">
        import { db, collection, getDocs, query, orderBy } from "./firebase-bridge.js";

        const bookid = localStorage.getItem('current_book_id');
        const backdropurl = localStorage.getItem('current_book_backdrop');
        let selectedpages = [];

        if (!bookid) location.href = 'magicbook.html';
        if (backdropurl) document.getElementById('main-backdrop').style.backgroundImage = `url('${backdropurl}')`;

        async function loadPages() {
            const list = document.getElementById('pageList');
            try {
                const q = query(collection(db, `books/${bookid}/pages`), orderBy("pagenumber", "asc"));
                const snap = await getDocs(q);
                list.innerHTML = "";
                document.getElementById('loading-overlay').style.display = 'none';

                if (snap.empty) {
                    list.innerHTML = "<p style='color:white; grid-column: 1/-1; text-align:center; opacity:0.7;'>Este libro está en blanco.</p>";
                    return;
                }

                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const thumb = document.createElement('div');
                    thumb.className = 'page-thumb';
                    thumb.style.animationDelay = (Math.random() * 2) + "s";
                    thumb.innerHTML = `<div class="page-num-label">${data.pagenumber}</div><div class="page-text-preview">${data.text_es || ''}</div>`;
                    thumb.onclick = () => {
                        const index = selectedpages.indexOf(data.imageurl);
                        if (index > -1) {
                            selectedpages.splice(index, 1);
                            thumb.classList.remove('selected');
                        } else {
                            selectedpages.push(data.imageurl);
                            thumb.classList.add('selected');
                        }
                    };
                    list.appendChild(thumb);
                });
            } catch (e) {
                console.error(e);
                document.getElementById('loading-overlay').innerText = "Error al abrir el libro.";
            }
        }

        window.goToActivity = () => {
            if (selectedpages.length === 0) { alert("Selecciona las páginas que quieres leer."); return; }
            localStorage.setItem('selected_pages_json', JSON.stringify(selectedpages));
            location.href = 'readassist.html';
        };

        window.onload = loadPages;
    </script>
</body>
</html>
