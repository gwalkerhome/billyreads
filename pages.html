<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Billy Reads | Selección de Páginas</title>
    <style>
        :root {
            --mc-font: 'Arial Black', Gadget, sans-serif;
            --gold-glow: 0 0 20px #ffd700, 0 0 40px rgba(255, 215, 0, 0.5);
        }

        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; background: #1a1a1a;
            font-family: var(--mc-font);
        }

        /* 16:9 Backdrop - Fills left 50% visually but sits behind everything */
        #main-backdrop {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* The scrolling window covering the right half */
        .asset-window {
            position: absolute;
            right: 5%; top: 10%;
            width: 45%; height: 70%;
            padding: 20px;
            overflow-y: auto;
            z-index: 10;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            box-sizing: border-box;
        }
        .asset-window::-webkit-scrollbar { width: 0px; }

        /* Parchment Thumbnail */
        .page-thumb {
            position: relative;
            aspect-ratio: 3/4;
            background: url('assets/paper1.png') no-repeat center center;
            background-size: contain;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15% 10%;
            box-sizing: border-box;
            text-align: center;
        }

        .page-thumb.selected {
            filter: drop-shadow(var(--gold-glow));
            transform: scale(1.05) translateY(-5px);
        }

        .page-num-label {
            font-size: 1.2rem;
            color: #4a3728;
            margin-bottom: 5px;
        }

        /* Scribbled text effect */
        .page-text-preview {
            font-family: serif;
            font-size: 5px; /* Intentionally tiny */
            line-height: 1.2;
            color: #5d4a3a;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 10;
            -webkit-box-orient: vertical;
            opacity: 0.7;
            font-style: italic;
        }

        /* Button Positioning */
        .ui-btn {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            border: none;
            background-color: transparent;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 0.1s;
        }
        .ui-btn:active { transform: scale(0.9); }

        #btn-back { 
            top: 2%; left: 2%; 
            width: 80px; height: 80px; 
            background-image: url('assets/back1.png');
        }

        #btn-settings { 
            bottom: 2%; right: 2%; 
            width: 80px; height: 80px; 
            background-image: url('assets/settings.png');
        }

        #btn-add {
            bottom: 5%; right: 15%;
            width: 150px; height: 60px;
            background: #4a90e2; color: white;
            border-radius: 15px; font-family: var(--mc-font);
            font-size: 0.8rem;
        }

        #btn-go {
            left: 25%; top: 50%;
            transform: translate(-50%, -50%);
            padding: 25px 50px;
            background: #4caf50; color: white;
            border-radius: 20px; font-family: var(--mc-font);
            font-size: 1.5rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        #loading-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center;
            color: white; z-index: 1000; font-family: var(--mc-font);
        }
    </style>
</head>
<body>

    <div id="loading-overlay">ABRIENDO LIBRO MÁGICO...</div>
    <div id="main-backdrop"></div>

    <button id="btn-back" class="ui-btn" onclick="location.href='magicbook.html'"></button>

    <button id="btn-go" class="ui-btn" onclick="goToActivity()">¡A LEER!</button>

    <div class="asset-window" id="pageList"></div>

    <button id="btn-add" class="ui-btn" onclick="location.href='addpages.html'">AÑADIR PÁGINAS</button>
    <button id="btn-settings" class="ui-btn" onclick="location.href='settings.html'"></button>

    <script type="module">
        import { db, collection, getDocs, query, orderBy } from "./firebase-bridge.js";

        const bookid = localStorage.getItem('current_book_id');
        const backdropurl = localStorage.getItem('current_book_backdrop');
        let selectedpages = [];

        if (!bookid) location.href = 'magicbook.html';

        if (backdropurl) {
            document.getElementById('main-backdrop').style.backgroundImage = `url('${backdropurl}')`;
        }

        async function loadPages() {
            const list = document.getElementById('pageList');
            try {
                const q = query(collection(db, `books/${bookid}/pages`), orderBy("pagenumber", "asc"));
                const snap = await getDocs(q);
                
                list.innerHTML = "";
                document.getElementById('loading-overlay').style.display = 'none';

                if (snap.empty) {
                    list.innerHTML = "<p style='color:white; grid-column: 1/-1; text-align:center; font-size:0.8rem;'>Este libro está en blanco.</p>";
                    return;
                }

                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const thumb = document.createElement('div');
                    thumb.className = 'page-thumb';
                    
                    // Create the textual parchment thumbnail content
                    thumb.innerHTML = `
                        <div class="page-num-label">${data.pagenumber}</div>
                        <div class="page-text-preview">${data.text_es || ''}</div>
                    `;
                    
                    thumb.onclick = () => {
                        const index = selectedpages.indexOf(data.imageurl);
                        if (index > -1) {
                            selectedpages.splice(index, 1);
                            thumb.classList.remove('selected');
                        } else {
                            selectedpages.push(data.imageurl);
                            thumb.classList.add('selected');
                        }
                    };
                    
                    list.appendChild(thumb);
                });
            } catch (e) {
                console.error("Error loading pages:", e);
                document.getElementById('loading-overlay').innerText = "Error al abrir el libro.";
            }
        }

        window.goToActivity = () => {
            if (selectedpages.length === 0) {
                alert("Selecciona las páginas que quieres leer.");
                return;
            }
            localStorage.setItem('selected_pages_json', JSON.stringify(selectedpages));
            location.href = 'readassist.html';
        };

        window.onload = loadPages;
    </script>
</body>
</html>
